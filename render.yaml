# ============================================================
# OrcaMet Portal — Render Blueprint
# ============================================================
# This file defines the infrastructure for one-click deployment.
# Push to GitHub, then connect via Render Dashboard > Blueprints.
# ============================================================

databases:
  - name: orcamet-db
    plan: free
    databaseName: orcamet_portal
    user: orcamet

services:
  - type: web
    plan: free
    name: orcamet-portal
    runtime: python
    buildCommand: "bash build.sh"
    startCommand: "gunicorn orcamet_portal.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: orcamet-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: PYTHON_VERSION
        value: "3.12.3"
      # Auth0 — set these manually in the Render dashboard
      # after creating your Auth0 application
      # - key: AUTH0_DOMAIN
      #   value: your-tenant.uk.auth0.com
      # - key: AUTH0_CLIENT_ID
      #   value: your-client-id
      # - key: AUTH0_CLIENT_SECRET
      #   value: your-client-secret
      # - key: OPENMETEO_API_KEY
      #   value: your-api-key

  # Per-site forecast run, every 6 hours. This matches the
  # orcamet-portal_site_forecasts cron job already running in the Render
  # dashboard — kept here so the blueprint stays in sync with what's
  # actually deployed. Cron jobs require a paid plan — Render's free
  # plan does not support the cron service type.
  #
  # Also runs cleanup_forecasts (30-day default retention) afterwards.
  # There was no cron job anywhere for it, so ForecastRun/HourlyForecast
  # grew without bound — piggybacking it here avoids paying for a
  # dedicated cron service just to run a cheap delete query.
  #
  # The live cron job is configured in the Render dashboard; updating this
  # blueprint does not change it. The dashboard command must be changed to
  # match for this to take effect in production.
  - type: cron
    plan: starter
    name: orcamet-portal_site_forecasts
    runtime: python
    schedule: "0 */6 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py run_forecasts && python manage.py cleanup_forecasts"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: orcamet-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.3"
      # OPENMETEO_API_KEY — set manually in the Render dashboard,
      # never commit a real key here
      # - key: OPENMETEO_API_KEY
      #   value: your-api-key

  # UK-wide risk grid + contour overlays, refreshed every 6 hours.
  #
  # NOTE: this job previously ran `generate_contour_cache`, which only writes
  # the legacy UKRiskMap model. The interactive weather map reads
  # UKRiskGridRun / UKRiskGridPoint / CachedContourImage, which only
  # `risk_grid` populates — so the map had no data source at all and rendered
  # empty. `risk_grid` now also pre-renders the contour overlays the map
  # serves from /dashboard/map/contour.png.
  #
  # The live cron job is configured in the Render dashboard; updating this
  # blueprint does not change it. The dashboard command must be changed to
  # match for the fix to take effect in production.
  - type: cron
    plan: starter
    name: orcamet-portal_risk_grid
    runtime: python
    schedule: "0 */6 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py risk_grid"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: orcamet-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.3"
      # OPENMETEO_API_KEY — set manually in the Render dashboard,
      # never commit a real key here
      # - key: OPENMETEO_API_KEY
      #   value: your-api-key
