# ============================================================
# OrcaMet Portal — Render Blueprint
# ============================================================
# This file defines the infrastructure for one-click deployment.
# Push to GitHub, then connect via Render Dashboard > Blueprints.
# ============================================================

databases:
  - name: orcamet-db
    plan: free
    databaseName: orcamet_portal
    user: orcamet

services:
  - type: web
    plan: free
    name: orcamet-portal
    runtime: python
    buildCommand: "bash build.sh"
    startCommand: "gunicorn orcamet_portal.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: orcamet-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: PYTHON_VERSION
        value: "3.12.3"
      # Auth0 — set these manually in the Render dashboard
      # after creating your Auth0 application
      # - key: AUTH0_DOMAIN
      #   value: your-tenant.uk.auth0.com
      # - key: AUTH0_CLIENT_ID
      #   value: your-client-id
      # - key: AUTH0_CLIENT_SECRET
      #   value: your-client-secret
      # - key: OPENMETEO_API_KEY
      #   value: your-api-key

  # Per-site forecast run, every 6 hours. This matches the
  # orcamet-portal_site_forecasts cron job already running in the Render
  # dashboard — kept here so the blueprint stays in sync with what's
  # actually deployed. Cron jobs require a paid plan — Render's free
  # plan does not support the cron service type.
  - type: cron
    plan: starter
    name: orcamet-portal_site_forecasts
    runtime: python
    schedule: "0 */6 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py run_forecasts"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: orcamet-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.3"
      # OPENMETEO_API_KEY — set manually in the Render dashboard,
      # never commit a real key here
      # - key: OPENMETEO_API_KEY
      #   value: your-api-key

  # UK-wide risk contour map, refreshed every 6 hours. This matches the
  # orcamet-portal_risk_grid cron job already running in the Render
  # dashboard — kept here so the blueprint stays in sync with what's
  # actually deployed.
  - type: cron
    plan: starter
    name: orcamet-portal_risk_grid
    runtime: python
    schedule: "0 */6 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py generate_contour_cache"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: orcamet-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.3"
      # OPENMETEO_API_KEY — set manually in the Render dashboard,
      # never commit a real key here
      # - key: OPENMETEO_API_KEY
      #   value: your-api-key
