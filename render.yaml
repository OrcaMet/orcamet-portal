# ============================================================
# OrcaMet Portal — Render Blueprint
# ============================================================
# This file defines the infrastructure for one-click deployment.
# Push to GitHub, then connect via Render Dashboard > Blueprints.
# ============================================================

databases:
  - name: orcamet-db
    # Must match the live instance type in the Render dashboard. These
    # resources are Blueprint managed, so a blueprint sync pushes whatever is
    # declared here onto live infra — declaring `free` would attempt to
    # downgrade the running database.
    plan: basic-256mb
    databaseName: orcamet_portal
    user: orcamet

services:
  - type: web
    # Live instance type (see the note on orcamet-db above).
    plan: starter
    name: orcamet-portal
    runtime: python
    buildCommand: "bash build.sh"
    startCommand: "gunicorn orcamet_portal.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: orcamet-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: PYTHON_VERSION
        value: "3.12.3"
      # CARTO basemap key. Without it CARTO stamps every map tile with an
      # "API KEY REQUIRED" watermark.
      #
      # sync: false means "this service uses this variable, but its value is
      # managed in the Render dashboard". Declaring it keeps a Blueprint sync
      # from removing the dashboard value, without the key ever entering git.
      # It is served to the browser with the map page, so restrict it by
      # domain in the CARTO dashboard rather than treating it as a secret.
      #
      # Only the web service needs it — the crons never render the map.
      - key: CARTO_API_KEY
        sync: false

      # Auth0 — set these manually in the Render dashboard
      # after creating your Auth0 application
      # - key: AUTH0_DOMAIN
      #   value: your-tenant.uk.auth0.com
      # - key: AUTH0_CLIENT_ID
      #   value: your-client-id
      # - key: AUTH0_CLIENT_SECRET
      #   value: your-client-secret
      # - key: OPENMETEO_API_KEY
      #   value: your-api-key

  # Per-site forecast run, every 6 hours. This matches the
  # orcamet-portal_site_forecasts cron job already running in the Render
  # dashboard — kept here so the blueprint stays in sync with what's
  # actually deployed. Cron jobs require a paid plan — Render's free
  # plan does not support the cron service type.
  #
  # Also runs cleanup_forecasts (30-day default retention) afterwards.
  # There was no cron job anywhere for it, so ForecastRun/HourlyForecast
  # grew without bound — piggybacking it here avoids paying for a
  # dedicated cron service just to run a cheap delete query.
  #
  # The live cron job is configured in the Render dashboard; updating this
  # blueprint does not change it. The dashboard command must be changed to
  # match for this to take effect in production.
  - type: cron
    plan: starter
    # Matches the live service name exactly (a space, not an underscore) so a
    # blueprint sync updates that cron instead of creating a duplicate.
    name: orcamet-portal_site forecasts
    runtime: python
    schedule: "0 */6 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py run_forecasts && python manage.py cleanup_forecasts"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: orcamet-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.3"
      # OPENMETEO_API_KEY — set manually in the Render dashboard,
      # never commit a real key here
      # - key: OPENMETEO_API_KEY
      #   value: your-api-key

  # UK-wide risk grid + contour overlays, refreshed every 6 hours.
  #
  # `risk_grid` is the only pipeline feeding the interactive weather map: it
  # populates UKRiskGridRun / UKRiskGridPoint and pre-renders the contour
  # overlays (CachedContourImage) served from /dashboard/map/contour.png.
  #
  # The live cron job is configured in the Render dashboard; updating this
  # blueprint does not change it. The dashboard command must be changed to
  # match for any change here to take effect in production.
  - type: cron
    plan: starter
    name: orcamet-portal_risk_grid
    runtime: python
    schedule: "0 */6 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py risk_grid"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: orcamet-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.3"
      # OPENMETEO_API_KEY — set manually in the Render dashboard,
      # never commit a real key here
      # - key: OPENMETEO_API_KEY
      #   value: your-api-key
